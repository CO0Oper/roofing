
# Deploys all pitch concepts from one Pages artifact:
#
#   /      -> the original Vite/React build (unchanged, built by `npm run build:github`)
#   /v2/   -> the static v2 concept in ./v2
#   /marco-roofing/ -> the Marco Roofing React/Vite concept
#   /ultimate/ -> the Ultimate Roof Repair static concept in ./ultimate
#                 (its responsive JPEGs are generated here from public/assets)
#
# GitHub Pages only serves one site per repository, so this workflow publishes
# every concept together and avoids competing deployments.

name: Deploy pitch concepts to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build original site
        run: npm run build:github

      - name: Build Marco Roofing concept
        run: npm run build:marco

      - name: Add v2 static site at /v2/
        run: |
          mkdir -p dist-github/v2
          cp -R v2/. dist-github/v2/
          touch dist-github/.nojekyll
          echo "--- published tree ---"
          find dist-github -maxdepth 2 -type d | sort

      - name: Add Marco Roofing concept at /marco-roofing/
        run: |
          mkdir -p dist-github/marco-roofing
          cp -R dist-marco/. dist-github/marco-roofing/
          touch dist-github/.nojekyll

      - name: Add Ultimate Roof Repair concept at /ultimate/
        run: |
          mkdir -p dist-github/ultimate
          cp -R ultimate/. dist-github/ultimate/
          # Derivatives are generated here rather than committed, so the repo
          # stays free of binary duplicates of the two source PNGs.
          mkdir -p dist-github/ultimate/assets
          for w in 880 1280 1800; do
            convert public/assets/ultimate-roof-hero.png \
              -resize "${w}x" -strip -interlace Plane -quality 82 \
              "dist-github/ultimate/assets/hero-${w}.jpg"
          done
          for w in 800 1200; do
            convert public/assets/ultimate-roof-detail.png \
              -resize "${w}x" -strip -interlace Plane -quality 82 \
              "dist-github/ultimate/assets/detail-${w}.jpg"
          done
          touch dist-github/.nojekyll
          ls -la dist-github/ultimate/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
