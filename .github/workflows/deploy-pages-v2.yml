# Deploys every pitch concept from one Pages artifact:
#
#   /                  -> a deliberately blank page (./root)
#   /ultimate/         -> the Ultimate Roof Repair static concept in ./ultimate
#                         (its responsive JPEGs are generated here from public/assets)
#   /ultimate/v2/      -> the Ultimate Roof Repair Vite/React build
#   /v2/               -> the TopGuard Roofing static concept in ./v2
#   /marco-roofing/    -> the Marco Roofing Vite/React build
#   /dryforce/         -> the Dryforce Vite/React build
#
# Nothing is linked from the root, so each concept is reached by typing its URL.
#
# GitHub Pages only serves one site per repository, so this workflow publishes
# every concept together and avoids competing deployments.

name: Deploy pitch concepts to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Ultimate Roof Repair Vite site
        run: npm run build:github

      - name: Build Marco Roofing concept
        run: npm run build:marco

      - name: Build Dryforce concept
        run: npm run build:dryforce

      - name: Build J Roofing concept
        run: npm run build:j-roofing

      - name: Serve a blank page at the root
        run: |
          mkdir -p dist-github
          cp root/index.html dist-github/index.html
          touch dist-github/.nojekyll

      - name: Add the Vite build at /ultimate/v2/
        run: |
          mkdir -p dist-github/ultimate/v2
          cp -R dist-ultimate-v2/. dist-github/ultimate/v2/

      - name: Add TopGuard static site at /v2/
        run: |
          mkdir -p dist-github/v2
          cp -R v2/. dist-github/v2/

      - name: Add Marco Roofing concept at /marco-roofing/
        run: |
          mkdir -p dist-github/marco-roofing
          cp -R dist-marco/. dist-github/marco-roofing/
          touch dist-github/.nojekyll

      - name: Add Dryforce concept at /dryforce/
        run: |
          mkdir -p dist-github/dryforce
          cp -R dist-dryforce/. dist-github/dryforce/

      - name: Add J Roofing concept at /j-roofing/
        run: |
          mkdir -p dist-github/j-roofing
          cp -R dist-j-roofing/. dist-github/j-roofing/

      - name: Add Ultimate Roof Repair concept at /ultimate/
        run: |
          set -euo pipefail
          mkdir -p dist-github/ultimate
          cp -R ultimate/. dist-github/ultimate/
          mkdir -p dist-github/ultimate/assets

          # The responsive derivatives are generated here rather than committed,
          # so the repo keeps one copy of each photograph instead of six.
          # ImageMagick is no longer preinstalled on the GitHub-hosted runners.
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq imagemagick || true
          fi

          hero=public/assets/ultimate-roof-hero.png
          detail=public/assets/ultimate-roof-detail.png
          out=dist-github/ultimate/assets

          if command -v convert >/dev/null 2>&1; then
            for w in 880 1280 1800; do
              convert "$hero" -resize "${w}x" -strip -interlace Plane -quality 82 "$out/hero-${w}.jpg"
            done
            for w in 800 1200; do
              convert "$detail" -resize "${w}x" -strip -interlace Plane -quality 82 "$out/detail-${w}.jpg"
            done
          else
            # Last-resort fallback: ship the originals under the expected names.
            # Browsers sniff image bytes, so the page still renders - just heavier.
            echo "::warning::ImageMagick unavailable; copying full-size PNGs instead"
            for w in 880 1280 1800; do cp "$hero" "$out/hero-${w}.jpg"; done
            for w in 800 1200; do cp "$detail" "$out/detail-${w}.jpg"; done
          fi

          touch dist-github/.nojekyll
          ls -la "$out"

      - name: Show the published tree
        run: find dist-github -maxdepth 2 -type d | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
