
# Deploys BOTH versions of the TopGuard site from one Pages artifact:
#
#   /      -> the original Vite/React build (unchanged, built by `npm run build:github`)
#   /v2/   -> the static v2 concept in ./v2
#
# GitHub Pages only serves one site per repository, so a single workflow has to
# publish both. Disable "Deploy to GitHub Pages" (deploy-pages.yml) in the
# Actions tab so the two workflows don't race each other for the Pages
# deployment lock. No existing source file is modified by this workflow.

name: Deploy both versions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build original site
        run: npm run build:github

      - name: Add v2 static site at /v2/
        run: |
          mkdir -p dist-github/v2
          cp -R v2/. dist-github/v2/
          touch dist-github/.nojekyll
          echo "--- published tree ---"
          find dist-github -maxdepth 2 -type d | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
